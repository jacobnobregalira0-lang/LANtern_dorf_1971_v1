<title>Lanterna — Dorf</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #000; color: #39ff88;
    font-family: Arial, sans-serif; display: flex; align-items: center;
    justify-content: center; text-align: center; overflow: hidden;
    transition: background .15s;
  }
  #game { width: 100%; min-height: 100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:20px; gap:18px; }
  h1 { font-size: clamp(22px, 6vw, 34px); margin:0; text-shadow:0 0 12px #18ff75; }
  #flashlight { width:min(78vw, 390px); max-height:48vh; object-fit:contain;
    cursor:pointer; user-select:none; -webkit-user-drag:none;
    filter: drop-shadow(0 0 10px #16ff6a); transition:transform .12s; }
  #flashlight:active { transform:scale(.96) rotate(-5deg); }
  #instruction { font-size:clamp(16px,4.5vw,22px); max-width:420px; line-height:1.4; }
  #count { font-size:18px; opacity:.9; }
  .white { background:#fff !important; }
  .white h1,.white #instruction,.white #count { color:#159447; text-shadow:none; }
  #status { font-size:15px; min-height:20px; }
  button { background:#092a16; border:1px solid #39ff88; color:#39ff88; border-radius:12px;
    padding:12px 18px; font-size:16px; }
</style>

<script>
const lamp = document.getElementById('flashlight');
const countText = document.getElementById('count');
const instruction = document.getElementById('instruction');
const statusText = document.getElementById('status');
let clicks = 0, active = false, timer = null, stream = null, track = null;

async function turnTorch(on) {
  // A lanterna física só pode ser controlada em aparelhos/navegadores compatíveis.
  if (!on) {
    try { if (track) { await track.applyConstraints({advanced:[{torch:false}]}); } } catch(e) {}
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; track = null; }
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    track = stream.getVideoTracks()[0];
    await track.applyConstraints({advanced:[{torch:true}]});
    statusText.textContent = "Lanterna do celular ligada!";
  } catch (e) {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; track = null; }
    statusText.textContent = "Efeito ativado! Seu navegador não liberou a lanterna física.";
  }
}

function activate() {
  if (active) return;
  active = true;
  document.body.classList.add('white');
  instruction.textContent = "Você ligou a lanterna! Ela vai apagar em 5 segundos...";
  countText.textContent = "✨ LIGADA ✨";
  turnTorch(true);
  timer = setTimeout(async () => {
    document.body.classList.remove('white');
    await turnTorch(false);
    active = false;
    clicks = 0;
    countText.textContent = "Chacoalhadas: 0/3";
    instruction.textContent = "A lanterna desligou. Chacoalhe de novo para ligar!";
    statusText.textContent = "";
  }, 5000);
}

lamp.addEventListener('click', () => {
  if (active) return;
  clicks++;
  lamp.animate([
    {transform:'rotate(0deg) translateX(0)'},
    {transform:'rotate(-12deg) translateX(-8px)'},
    {transform:'rotate(12deg) translateX(8px)'},
    {transform:'rotate(0deg) translateX(0)'}
  ], {duration:220});
  countText.textContent = `Chacoalhadas: ${clicks}/3`;
  if (clicks >= 3) activate();
});
</script>
